name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! 🙏
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a task
        2. Set a deadline to…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options: [Web UI, MCP server, REST API, Install / setup, Other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node 22.14, macOS 15, Chrome 130, theme: Paper"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here, or paste terminal output.
